<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Metatron">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#e36fa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#glow)"/>

  <g fill="none" stroke="#ffffff" stroke-width="7"
     stroke-linejoin="round" stroke-linecap="round" opacity="0.95">
    <!-- outer hexagon -->
    <polygon points="128,46 199,87 199,169 128,210 57,169 57,87"/>
    <!-- hexagram (two interlocking triangles) -->
    <polygon points="128,46 199,169 57,169"/>
    <polygon points="199,87 128,210 57,87"/>
  </g>

  <circle cx="128" cy="128" r="12" fill="#ffffff"/>
</svg>
